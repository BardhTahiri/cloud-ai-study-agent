services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_ai_study_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345678}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cloud_ai_study_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["local-agent"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-api:
    profiles: ["local-agent"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports:
      - "8010:8010"
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_API_KEY: ${AGENT_API_KEY:-local-agent-key}
      AGENT_RESULT_EXPIRES_SECONDS: ${AGENT_RESULT_EXPIRES_SECONDS:-604800}
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-12345678}@postgres:5432/${POSTGRES_DB:-cloud_ai_study_agent}
      LOCAL_STORAGE_PATH: /app/storage/uploads
      TASK_QUEUE_MODE: ${TASK_QUEUE_MODE:-local}
      TASK_QUEUE_FALLBACK_LOCAL: ${TASK_QUEUE_FALLBACK_LOCAL:-false}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://agent-api:8010}
      AGENT_API_KEY: ${AGENT_API_KEY:-local-agent-key}
      AGENT_HTTP_TIMEOUT_SECONDS: ${AGENT_HTTP_TIMEOUT_SECONDS:-15}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FREE_LLM_MODEL: ${FREE_LLM_MODEL:-qwen3:8b}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      CODEX_BIN: ${CODEX_BIN:-codex}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-300}
      LLM_FALLBACK_TO_OFFLINE: ${LLM_FALLBACK_TO_OFFLINE:-false}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-100000}
      FREE_LLM_MAX_INPUT_CHARS: ${FREE_LLM_MAX_INPUT_CHARS:-12000}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["local-agent"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["celery", "-A", "worker.app.celery_app:celery_app", "worker", "--loglevel=info"]
    environment:
      REDIS_URL: redis://redis:6379/0
      AGENT_RESULT_EXPIRES_SECONDS: ${AGENT_RESULT_EXPIRES_SECONDS:-604800}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FREE_LLM_MODEL: ${FREE_LLM_MODEL:-qwen3:8b}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-sol}
      CODEX_BIN: ${CODEX_BIN:-codex}
      CODEX_HOME: /codex-auth
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-300}
      LLM_FALLBACK_TO_OFFLINE: ${LLM_FALLBACK_TO_OFFLINE:-false}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-100000}
      FREE_LLM_MAX_INPUT_CHARS: ${FREE_LLM_MAX_INPUT_CHARS:-12000}
      AGENT_PROVIDER_RETRY_DELAY_SECONDS: ${AGENT_PROVIDER_RETRY_DELAY_SECONDS:-300}
      AGENT_PROVIDER_MAX_RETRIES: ${AGENT_PROVIDER_MAX_RETRIES:-288}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - codex_auth:/codex-auth
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  codex_auth:
